services:
  - type: web
    name: cortexgrid-worker
    runtime: node
    buildCommand: pnpm install && pnpm --filter @cortexgrid/api db:generate && pnpm --filter @cortexgrid/api build
    startCommand: cd apps/api && WORKER_MODE=true node dist/main-worker.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: "true"
      - key: PORT
        value: "3001"
      # Database (Supabase)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Redis (Upstash)
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      # MQTT (HiveMQ Cloud)
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      # Auth
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: "15m"
      - key: JWT_REFRESH_EXPIRY
        value: "7d"
      # CORS
      - key: CORS_ORIGIN
        sync: false
      # AI
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_PRICE_ID
        sync: false
      # Frontend URL for Stripe redirects
      - key: FRONTEND_URL
        sync: false
