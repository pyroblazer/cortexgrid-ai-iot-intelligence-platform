services:
  - type: web
    name: cortexgrid-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm --filter @cortexgrid/api db:generate && pnpm --filter @cortexgrid/api build
    startCommand: cd apps/api && node dist/main-worker.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Database (Neon PostgreSQL)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Redis (Upstash)
      - key: REDIS_URL
        sync: false
      # MQTT (HiveMQ Cloud)
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      # Auth
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: "15m"
      - key: JWT_REFRESH_EXPIRY
        value: "7d"
      # CORS (set to Vercel URL after deployment)
      - key: CORS_ORIGIN
        sync: false
      # Frontend URL (for Stripe redirects and password reset emails)
      - key: FRONTEND_URL
        sync: false
      # AI (Groq Cloud)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      # Stripe (optional — billing disabled if empty)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_PRICE_ID
        sync: false
      # Email (Resend — emails skipped if RESEND_API_KEY is empty)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "CortexGrid <onboarding@resend.dev>"
